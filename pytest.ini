[pytest]
# The repo root on sys.path, so the documented `pytest` works.
#
# Every module under test lives at the repo root (services.py, rules.py, ai_content.py)
# but the tests live in tests/, and with no __init__.py pytest prepends tests/ only. A
# bare `pytest` therefore died at collection with "No module named services" while
# `python -m pytest` (which adds CWD) worked — so every run needed the -m form and
# nothing said so. Needs pytest >= 7.
pythonpath = .
